name: AtivoSAGA Pipeline (CI/CD)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  qualidade_e_testes:
    runs-on: ubuntu-latest

    services:
      banco_teste:
        image: postgres:15
        env:
          POSTGRES_USER: user_teste
          POSTGRES_PASSWORD: senha_teste
          POSTGRES_DB: ativosaga_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Instalar Dependências do Sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev python3-dev

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Instalar Dependências Python
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest httpx pika sqlalchemy psycopg2-binary passlib python-jose[cryptography] fastapi uvicorn
        echo "Instalando requisitos de todos os serviços..."
        pip install -r ativosaga/servico_identidade/requirements.txt
        pip install -r ativosaga/servico_pedidos/requirements.txt
        pip install -r ativosaga/servico_pagamentos/requirements.txt

    - name: Executar Linter (Ruff)
      run: ruff check ativosaga/

    - name: Executar Testes de Integração
      env:
        DATABASE_URL: postgresql://user_teste:senha_teste@localhost:5432/ativosaga_teste
        RABBITMQ_HOST: localhost
        JWT_SECRET: teste_secret
      run: |
        echo "Rodando testes de Identidade..."
        cd ativosaga/servico_identidade
        pytest testes_identidade.py teste_integracao.py
        
        echo "Rodando testes de Pedidos..."
        cd ../servico_pedidos
        pytest testes_pedidos.py
        
        echo "Rodando testes de Pagamentos..."
        cd ../servico_pagamentos
        pytest teste_fase4.py
