name: Pipeline de CI/CD AtivoSAGA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Variáveis globais para o Docker Compose no ambiente de CI
env:
  POSTGRES_USER: usuario_loja
  POSTGRES_PASSWORD: senha_loja
  POSTGRES_DB: ativosaga
  RABBITMQ_DEFAULT_USER: convidado
  RABBITMQ_DEFAULT_PASS: convidado
  RABBITMQ_HOST: rabbitmq
  DATABASE_URL: postgresql://usuario_loja:senha_loja@banco:5432/ativosaga
  JWT_SECRET: teste_secret
  STRIPE_SECRET_KEY: sk_test_simulada
  STRIPE_WEBHOOK_SECRET: whsec_simulada

jobs:
  qualidade_e_testes:
    name: Qualidade e Testes de Integração
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v3

    - name: Configurar Ambiente Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Instalar Ruff para Linter
      run: pip install ruff

    - name: Análise Estática de Código (Linter Ruff)
      run: ruff check ativosaga/

    - name: Subir Infraestrutura de Teste (Docker Compose)
      run: |
        cd ativosaga
        docker compose up -d
        echo "⏳ Aguardando serviços iniciarem (30s)..."
        sleep 30

    - name: Execução dos Testes de Integração (Saga E2E)
      run: |
        echo "🚀 Iniciando bateria de testes dentro do ambiente Docker..."
        # Rodamos os testes dentro dos containers para garantir rede interna e dependências corretas
        docker exec ativosaga_identidade pytest testes_identidade.py teste_integracao.py
        docker exec ativosaga_pedidos pytest testes_pedidos.py
        
        # Teste de Saga E2E Real (Coreografia)
        docker exec ativosaga_pedidos pytest -s testes_e2e_saga.py

    - name: Limpeza do Ambiente
      if: always()
      run: |
        cd ativosaga
        docker compose down
