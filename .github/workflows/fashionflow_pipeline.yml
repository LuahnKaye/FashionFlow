name: FashionFlow Pipeline (CI/CD)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  qualidade_e_testes:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Instalar Dependências (Identidade)
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest httpx
        pip install -r fashion-flow/servico_identidade/requirements.txt

    - name: Executar Linter (Ruff)
      run: ruff check fashion-flow/

    - name: Executar Testes Automatizados (Pytest)
      run: |
        export DATABASE_URL="sqlite:///./test.db"
        cd fashion-flow/servico_identidade
        pytest testes_identidade.py
