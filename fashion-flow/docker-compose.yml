services:
  # 🐘 O Banco de Dados Centralizado (PostgreSQL)
  banco:
    image: postgres:15
    container_name: fashionflow_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - dados_postgres_v2:/var/lib/postgresql/data

  # 🐰 O Sistema de Mensageria
  rabbitmq:
    image: rabbitmq:3-management
    container_name: fashionflow_mq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 👤 Serviço de Identidade
  identidade:
    build: ./servico_identidade
    container_name: fashionflow_identidade
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      banco:
        condition: service_healthy

  # 📝 Serviço de Pedidos
  pedidos:
    build: ./servico_pedidos
    container_name: fashionflow_pedidos
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_PASS=${RABBITMQ_DEFAULT_PASS}
      - DD_SERVICE=fashionflow-pedidos
      - DD_ENV=producao
      - DD_VERSION=1.0.0
      - DD_AGENT_HOST=datadog-agent
    depends_on:
      rabbitmq:
        condition: service_healthy
      banco:
        condition: service_healthy

  # 📦 Serviço de Estoque
  estoque:
    build: ./servico_estoque
    container_name: fashionflow_estoque
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_PASS=${RABBITMQ_DEFAULT_PASS}
      - DD_SERVICE=fashionflow-estoque
      - DD_ENV=producao
      - DD_VERSION=1.0.0
      - DD_AGENT_HOST=datadog-agent
    depends_on:
      rabbitmq:
        condition: service_healthy
      banco:
        condition: service_healthy

  # 💳 Serviço de Pagamentos
  pagamentos:
    build: ./servico_pagamentos
    container_name: fashionflow_pagamentos
    ports:
      - "8002:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_PASS=${RABBITMQ_DEFAULT_PASS}
      - DD_SERVICE=fashionflow-pagamentos
      - DD_ENV=producao
      - DD_VERSION=1.0.0
      - DD_AGENT_HOST=datadog-agent
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
    depends_on:
      rabbitmq:
        condition: service_healthy
      banco:
        condition: service_healthy

  # 🖼️ Serviço de Ativos
  ativos:
    build: ./servico_ativos
    container_name: fashionflow_ativos
    ports:
      - "8003:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_PASS=${RABBITMQ_DEFAULT_PASS}
      - DD_SERVICE=fashionflow-ativos
      - DD_ENV=producao
      - DD_VERSION=1.0.0
      - DD_AGENT_HOST=datadog-agent
    depends_on:
      rabbitmq:
        condition: service_healthy
      banco:
        condition: service_healthy

  # 📧 Serviço de Notificações
  notificacoes:
    build: ./servico_notificacoes
    container_name: fashionflow_notificacoes
    environment:
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_PASS=${RABBITMQ_DEFAULT_PASS}
    depends_on:
      rabbitmq:
        condition: service_healthy

  # 🐕 Agente de Observabilidade (Datadog)
  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    container_name: fashionflow_monitor
    environment:
      - DD_API_KEY=INSIRA_SUA_CHAVE_AQUI
      - DD_SITE=datadoghq.com
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro

networks:
  default:
    name: fashionflow_network

volumes:
  dados_postgres_v2:
